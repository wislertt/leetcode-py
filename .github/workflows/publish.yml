name: publish-python-package

on:
    workflow_call:
        inputs:
            version:
                required: true
                type: string
                description: "PEP440 version string"
            registry:
                required: false
                type: string
                description: "Publish registry (pypi or test-pypi)"
                default: "test-pypi"
            python_version:
                required: false
                type: string
                description: "Python version"
        secrets:
            PYPI_API_TOKEN:
                required: true

jobs:
    publish:
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            - name: checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: set-python-version
              env:
                  PYTHON_VERSION: ${{ inputs.python_version }}
              run: echo "$PYTHON_VERSION" > .python-version

            - name: setup-mise
              uses: jdx/mise-action@3277a0f272901982804abc53abd93520db809be4 # v5.4.0

            - name: install-dependencies
              run: uv sync --all-extras --all-groups --frozen

            - name: setup-path
              run: echo "${{ github.workspace }}/.venv/bin" >> "$GITHUB_PATH"

            - name: publish
              env:
                  BAKE_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
                  REGISTRY: ${{ inputs.registry }}
                  VERSION: ${{ inputs.version }}
              run: bake publish --registry "$REGISTRY" --version "$VERSION"
