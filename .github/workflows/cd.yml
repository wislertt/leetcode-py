name: cd

on:
    push:
        branches:
            - main
    workflow_dispatch:

permissions:
    contents: write
    issues: write
    pull-requests: write

jobs:
    # ====================================================
    # Versioning and Release
    # ====================================================
    semantic-release:
        name: semantic-release
        uses: wislertt/zerv/.github/workflows/shared-semantic-release.yml@2467682262a92a0b41c726b2bb0a261f66338be7 # v0.8.41
        with:
            allowed_workflow_dispatch_branches: '["main"]'
            fail_on_invalid_workflow_dispatch_ref: true

    zerv-versioning:
        needs: semantic-release
        if: needs.semantic-release.outputs.is_valid_semantic_release == 'true'
        uses: wislertt/zerv/.github/workflows/shared-zerv-versioning.yml@2467682262a92a0b41c726b2bb0a261f66338be7 # v0.8.41

    create-version-prefix-tags:
        needs: zerv-versioning
        uses: wislertt/zerv/.github/workflows/shared-create-tags.yml@2467682262a92a0b41c726b2bb0a261f66338be7 # v0.8.41
        with:
            tags: >-
                [
                  "${{ fromJson(needs.zerv-versioning.outputs.versions).v_major }}",
                  "${{ fromJson(needs.zerv-versioning.outputs.versions).v_major_minor }}"
                ]

    # ====================================================
    # Test and Lint
    # ====================================================
    test:
        uses: ./.github/workflows/test.yml
        secrets:
            SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
            CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    test-reproducibility:
        name: test-reproducibility
        uses: ./.github/workflows/test-reproducibility.yml

    pre-commit:
        name: pre-commit
        uses: ./.github/workflows/pre-commit.yml

    # ====================================================
    # Deployment
    # ====================================================
    publish-pypi:
        needs: zerv-versioning
        uses: ./.github/workflows/publish.yml
        with:
            version: ${{ fromJson(needs.zerv-versioning.outputs.versions).pep440 }}
            registry: "pypi"
            python_version: "3.15"
        secrets:
            PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}

    publish-test-pypi:
        needs: zerv-versioning
        uses: ./.github/workflows/publish.yml
        with:
            version: ${{ fromJson(needs.zerv-versioning.outputs.versions).pep440 }}
            registry: "test-pypi"
            python_version: "3.15"
        secrets:
            PYPI_API_TOKEN: ${{ secrets.TEST_PYPI_API_TOKEN }}
