name: cd

on:
    push:
        branches:
            - main
    workflow_dispatch:

permissions: {}

concurrency:
    group: ${{ github.workflow }}-caller-${{ github.ref }}
    # queue, never cancel: a cancelled run could stop a release halfway
    cancel-in-progress: false

jobs:
    # ====================================================
    # Versioning and Release
    # ====================================================
    semantic-release:
        name: semantic-release
        uses: wislertt/zerv/.github/workflows/shared-semantic-release.yml@348c40b7e38f9ac640b85919de2d45c7077f6507 # v0.8.42
        permissions:
            contents: write
            issues: write
            pull-requests: write
        with:
            allowed_workflow_dispatch_branches: '["main"]'
            fail_on_invalid_workflow_dispatch_ref: true

    zerv-versioning:
        needs: semantic-release
        if: needs.semantic-release.outputs.is_valid_semantic_release == 'true'
        uses: wislertt/zerv/.github/workflows/shared-zerv-versioning.yml@348c40b7e38f9ac640b85919de2d45c7077f6507 # v0.8.42
        permissions:
            contents: read

    create-version-prefix-tags:
        needs: zerv-versioning
        uses: wislertt/zerv/.github/workflows/shared-create-tags.yml@348c40b7e38f9ac640b85919de2d45c7077f6507 # v0.8.42
        permissions:
            contents: write
        with:
            tags: >-
                [
                  "${{ fromJson(needs.zerv-versioning.outputs.versions).v_major }}",
                  "${{ fromJson(needs.zerv-versioning.outputs.versions).v_major_minor }}"
                ]

    # ====================================================
    # Test and Lint
    # ====================================================
    test:
        uses: ./.github/workflows/test.yml
        permissions:
            contents: read
        secrets:
            SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
            CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    test-reproducibility:
        name: test-reproducibility
        uses: ./.github/workflows/test-reproducibility.yml
        permissions:
            contents: read

    pre-commit:
        name: pre-commit
        uses: ./.github/workflows/pre-commit.yml
        permissions:
            contents: read

    # ====================================================
    # Deployment
    # ====================================================
    publish-pypi:
        needs: zerv-versioning
        uses: ./.github/workflows/publish.yml
        permissions:
            contents: read
        with:
            version: ${{ fromJson(needs.zerv-versioning.outputs.versions).pep440 }}
            registry: "pypi"
            python_version: "3.15"
        secrets:
            PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}

    publish-test-pypi:
        needs: zerv-versioning
        uses: ./.github/workflows/publish.yml
        permissions:
            contents: read
        with:
            version: ${{ fromJson(needs.zerv-versioning.outputs.versions).pep440 }}
            registry: "test-pypi"
            python_version: "3.15"
        secrets:
            PYPI_API_TOKEN: ${{ secrets.TEST_PYPI_API_TOKEN }}
