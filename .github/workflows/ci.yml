name: ci

on:
    pull_request:
        types: [opened, synchronize, reopened]

permissions: {}

concurrency:
    group: ${{ github.workflow }}-caller-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    # ====================================================
    # Versioning and Release
    # ====================================================
    check-pre-release:
        name: check-pre-release
        uses: wislertt/zerv/.github/workflows/shared-check-pr-label-and-branch.yml@036c1339c52b67601fa9c6ddc1b2086eda01e150 # v0.8.46
        permissions:
            contents: read
            pull-requests: read
        with:
            target_label: "pre-release"
            branch_prefixes: '["release/"]'
            branch_names: '["develop"]'

    zerv-versioning:
        name: zerv-versioning
        needs: check-pre-release
        uses: wislertt/zerv/.github/workflows/shared-zerv-versioning.yml@036c1339c52b67601fa9c6ddc1b2086eda01e150 # v0.8.46
        permissions:
            contents: read
        with:
            schema: >-
                ${{ (needs.check-pre-release.outputs.is_valid == 'true'
                && 'standard-base-prerelease-post')
                || 'standard-base-prerelease-post-dev' }}

    tag-pre-release:
        name: tag-pre-release
        needs: [zerv-versioning, check-pre-release]
        if: needs.check-pre-release.outputs.is_valid == 'true'
        uses: wislertt/zerv/.github/workflows/shared-create-tags.yml@036c1339c52b67601fa9c6ddc1b2086eda01e150 # v0.8.46
        permissions:
            contents: write
        with:
            tags: '["${{ fromJson(needs.zerv-versioning.outputs.versions).v_semver }}"]'

    # ====================================================
    # Test and Lint
    # ====================================================
    test:
        name: test
        uses: ./.github/workflows/test.yml
        permissions:
            contents: read
        secrets:
            SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
            CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    test-reproducibility:
        name: test-reproducibility
        uses: ./.github/workflows/test-reproducibility.yml
        permissions:
            contents: read

    pre-commit:
        name: pre-commit
        uses: ./.github/workflows/pre-commit.yml
        permissions:
            contents: read

    # ====================================================
    # Deployment
    # ====================================================
    publish-test-pypi:
        if: needs.check-pre-release.outputs.has_label == 'true'
        needs: [zerv-versioning, check-pre-release]
        uses: ./.github/workflows/publish.yml
        permissions:
            contents: read
        with:
            version: ${{ fromJson(needs.zerv-versioning.outputs.versions).pep440 }}
            registry: "test-pypi"
            python_version: "3.15"
        secrets:
            PYPI_API_TOKEN: ${{ secrets.TEST_PYPI_API_TOKEN }}
